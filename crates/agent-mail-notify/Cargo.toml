[package]
name = "agent-mail-notify"
version.workspace = true
edition.workspace = true
description = "Codex and Claude Code notification adapters for Agent Mail"
license.workspace = true
repository.workspace = true

[dependencies]
agent-mail-client = { path = "../agent-mail-client" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
